<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia Lipstein - Pedidos Rápidos</title>
    <!-- Tailwind CSS para estilado rápido sin escribir CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header Principal (Estilo FarmaPlus) -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        
        <!-- Barra Superior: Logo, Buscador y Carrito -->
        <div class="container mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            
            <!-- Logo que funciona como botón de inicio -->
<a href="index.html" class="flex items-center cursor-pointer">
    <img src="/images/LOGOLIPSTEIN.jpeg" alt="Logo FarmaSur" class="h-8 w-auto object-contain hover:opacity-90 transition-opacity">
</a>
            
            <!-- Buscador (Visual por ahora, da mucha presencia) -->
            <div class="flex-grow max-w-2xl hidden md:block">
                <div class="relative">
                    <input type="text" placeholder="¿Qué estás buscando? (Ej: Ibupirac, Shampoo...)" 
                           class="w-full border-2 border-gray-200 rounded-full py-2.5 px-5 focus:outline-none focus:border-blue-500 transition">
                    <button class="absolute right-4 top-3 text-gray-400 font-bold hover:text-blue-500">
                        Buscar
                    </button>
                </div>
            </div>

            <!-- Botón del Carrito (Mantiene los IDs originales para no romper el JS) -->
            <button id="cartBtn" class="flex items-center gap-2 bg-blue-50 text-blue-800 border border-blue-200 px-5 py-2.5 rounded-full font-bold hover:bg-blue-100 transition">
                🛒 Mi Compra 
                <span id="cartCount" class="bg-blue-800 text-white rounded-full w-6 h-6 flex items-center justify-center text-sm shadow-sm">
                    0
                </span>
            </button>
        </div>

        <!-- Navbar Inferior: Categorías -->
        <nav class="bg-blue-800 text-white text-sm font-semibold shadow-inner">
            <div class="container mx-auto px-4">
                <ul class="flex space-x-8 overflow-x-auto py-3 hide-scrollbar">
                    <li class="whitespace-nowrap hover:text-green-400 cursor-pointer transition border-b-2 border-transparent hover:border-green-400 pb-1">🔥 Ofertas del Mes</li>
                    <li class="whitespace-nowrap hover:text-green-400 cursor-pointer transition border-b-2 border-transparent hover:border-green-400 pb-1">💊 Venta Libre</li>
                    <li class="whitespace-nowrap hover:text-green-400 cursor-pointer transition border-b-2 border-transparent hover:border-green-400 pb-1">🧴 Dermocosmética</li>
                    <li class="whitespace-nowrap hover:text-green-400 cursor-pointer transition border-b-2 border-transparent hover:border-green-400 pb-1">Cuidado Personal</li>
                    <li class="whitespace-nowrap hover:text-green-400 cursor-pointer transition border-b-2 border-transparent hover:border-green-400 pb-1">👶 Bebés y Maternidad</li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Catálogo de Productos (Venta Libre) -->
    <main class="container mx-auto p-4 mt-6">
        <h2 class="text-xl font-bold mb-4 text-gray-800">Ofertas y Venta Libre</h2>
        
        <!-- Grilla de Productos -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="productGrid">
        </div>
    </main>

    


    <script src="productos.js"></script>
    <script src="carrito.js"></script>
    <!-- Lógica de Carrito y WhatsApp -->
    <script>
  
        // Abre el modal al tocar el botón del nav
        document.getElementById('cartBtn').addEventListener('click', toggleCart);

        function sendToWhatsApp() {
            const name = document.getElementById('clientName').value;
            const address = document.getElementById('clientAddress').value;
            
            if(!name || cart.length === 0) {
                alert("Agregá productos y tu nombre para continuar.");
                return;
            }

            let message = `Hola Farmacia Sur, soy ${name}. Quería hacer el siguiente pedido:\n\n`;
            cart.forEach(item => {
                message += `- ${item.name} ($${item.price})\n`;
            });
            message += `\n*Total aproximado: $${total}*\n`;
            
            if(address) {
                message += `\n📍 Dirección de entrega: ${address}`;
            } else {
                message += `\n🏪 Paso a retirar por el local.`;
            }

            // Codificamos el mensaje para que sea una URL válida
            const whatsappUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }
        // Función para renderizar las tarjetas dinámicamente
        function renderizarProductos() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = ''; // Limpiamos por las dudas

            productosFarmacia.forEach(prod => {
                // Lógica condicional: si hay descuento, mostramos la etiqueta y el precio tachado
                const htmlDescuento = prod.descuento 
                    ? `<div class="absolute top-2 left-2 bg-green-500 text-white text-xs font-bold px-2 py-1 rounded z-10">${prod.descuento}</div>` 
                    : '';
                
                const htmlPrecioViejo = prod.precioViejo 
                    ? `<p class="text-gray-400 text-xs line-through mb-0.5">$${prod.precioViejo}</p>` 
                    : `<p class="text-white text-xs mb-0.5 select-none">Espacio</p>`;

                // Creamos la tarjeta y le inyectamos los datos con template strings (`)
                const tarjetaHtml = `
                    <div class="bg-white rounded-xl shadow-sm hover:shadow-xl transition-shadow duration-300 border border-gray-100 overflow-hidden flex flex-col relative group">
                        ${htmlDescuento}
                        
                        <!-- Fijate cómo el enlace lleva a producto.html pasándole el ID -->
                        <a href="producto.html?id=${prod.id}" class="p-4 flex-grow flex items-center justify-center h-40 bg-white relative cursor-pointer">
                            <img src="${prod.imagen}" alt="${prod.nombre}" class="max-h-full object-contain group-hover:scale-105 transition-transform duration-300">
                        </a>

                        <div class="p-4 border-t border-gray-50 flex flex-col flex-grow justify-between">
                            <a href="producto.html?id=${prod.id}" class="block cursor-pointer">
                                <span class="text-xs text-gray-400 font-bold uppercase tracking-wider">${prod.marca}</span>
                                <h3 class="font-bold text-gray-800 text-sm leading-tight mt-1 mb-1 line-clamp-2">${prod.nombre}</h3>
                                <p class="text-xs text-gray-500 mb-2">${prod.formato}</p>
                            </a>
                            
                            <div class="mt-2">
                                ${htmlPrecioViejo}
                                <p class="text-blue-800 font-extrabold text-xl mb-3">$${prod.precio}</p>
                                
                                <button onclick="addToCart('${prod.nombre}', ${prod.precio})" class="w-full bg-white text-blue-700 border-2 border-blue-700 font-bold py-1.5 rounded-lg group-hover:bg-blue-700 group-hover:text-white transition-colors duration-200 text-sm flex items-center justify-center gap-2">
                                    <span>🛒</span> Agregar
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                grid.innerHTML += tarjetaHtml; // Agregamos la tarjeta al HTML
            });
        }

        // Ejecutamos la función apenas carga la página
        renderizarProductos();
    </script>
</body>
</html>
