<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto - FarmaSur</title>
    <link rel="icon" type="image/x-icon" href="images/assets/faviconn.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos para animar suavemente el menú desplegable (acordeón) */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <!-- HEADER (Idéntico a index.html estilo FarmaPlus) -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <!-- Barra Superior: Logo, Buscador y Carrito -->
        <div class="container mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <!-- Logo que funciona como botón de inicio -->
<a href="index.html" class="flex items-center cursor-pointer">
    <img src="images/assets/LOGOLIPSTEIN.jpeg" alt="Logo FarmaSur" class="h-8 w-auto object-contain hover:opacity-90 transition-opacity">
</a>
            
            <!-- Buscador Funcional con lupa (sin texto) -->
           <div class="flex-grow max-w-2xl hidden md:block relative z-50">
            <form action="categoria.html" method="GET" class="relative">
                <input type="text" name="buscar" id="searchInput" oninput="buscarEnTiempoReal()" autocomplete="off" placeholder="Buscar" 
                       class="w-full border-2 border-gray-150 rounded-full py-2.5 pl-5 pr-12 focus:outline-none focus:border-blue-500 transition text-sm bg-gray-50/50">
                
                <!-- Botón de lupa minimalista (en lugar de la palabra Buscar) -->
                <button type="submit" class="absolute right-3.5 top-2.5 p-1 text-gray-400 hover:text-blue-600 transition cursor-pointer" aria-label="Buscar">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.637 10.637z"/>
                    </svg>
                </button>
            </form>

            <!-- Caja flotante de resultados -->
            <div id="searchDropdown" class="hidden absolute top-full left-0 right-0 mt-2 bg-white border border-gray-200 rounded-xl shadow-2xl overflow-hidden max-h-96 overflow-y-auto">
                <ul id="searchResultsList" class="divide-y divide-gray-100">
                    <!-- Los resultados se inyectan acá desde JS -->
                </ul>
            </div>
        </div>

       <!-- Botón de Carrito de Compras Tradicional, Cuadrado y Minimalista (Corregido) -->
       <button id="cartBtn" class="relative p-2 text-blue-900 hover:text-blue-700 transition flex items-center justify-center cursor-pointer" aria-label="Mi Compra">
        <!-- Icono de Carrito con Ruedas (SVG Vectorial de tamaño válido w-8 h-8) -->
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <!-- El canasto cuadrado del carro -->
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272" />
            <!-- Las rueditas del carrito -->
            <circle cx="6" cy="20.25" r="1.25" fill="currentColor" />
            <circle cx="18.75" cy="20.25" r="1.25" fill="currentColor" />
        </svg>
        
        <!-- Globito del contador rojo anclado arriba a la derecha del carro -->
        <!-- Cambiado a top-0 right-0 y con posición absoluta para que flote bien -->
        <span id="cartCount" class="absolute top-0 right-0 bg-red-500 text-white rounded-full min-w-[18px] h-[18px] px-1 flex items-center justify-center text-[10px] font-black border-2 border-white shadow-sm transform translate-x-1 -translate-y-1">0</span>
    </button>
        </div>

        <!-- Navbar Inferior con Menú Desplegable (Hover) -->
       <nav class="bg-blue-800 text-white text-sm font-semibold shadow-inner relative z-40">
        <div class="container mx-auto px-4">
            <ul class="flex space-x-8 overflow-visible py-3 hide-scrollbar items-center">
                
                <!-- 1. BOTÓN CATEGORÍAS (Desplegable) -->
                <!-- La clase 'group' le avisa a Tailwind que este elemento tiene un hover especial -->
                <li class="relative group">
                    <span class="whitespace-nowrap flex items-center gap-1 cursor-default pb-1 border-b-2 border-transparent hover:text-green-400 transition">
                        ☰ Categorías
                        <svg class="w-4 h-4 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </span>

                    <!-- PRIMER NIVEL: Menú Principal -->
                    <ul class="absolute left-0 top-full mt-0 w-64 bg-white border border-gray-100 shadow-xl rounded-b-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 py-2 text-gray-700">
                        
                        <!-- Categoría Principal 1 -->
                        <!-- 'group/sub' crea un contexto de hover separado para el submenú -->
                        <li class="relative group/sub">
                            <span class="px-5 py-3 hover:bg-blue-50 flex justify-between items-center cursor-default hover:text-blue-700 transition-colors">
                                💊 Venta Libre
                                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </span>
                            
                            <!-- SEGUNDO NIVEL: Submenú de Venta Libre -->
                            <ul class="absolute left-full top-0 ml-0 w-56 bg-white border border-gray-100 shadow-xl rounded-lg opacity-0 invisible group-hover/sub:opacity-100 group-hover/sub:visible transition-all duration-200 z-50 py-2">
                                <li><a href="categoria.html?nombre=Medicamentos" class="block px-5 py-2 hover:bg-blue-50 hover:text-blue-700 transition-colors">Analgésicos</a></li>
                                <li><a href="categoria.html?nombre=Antigripales" class="block px-5 py-2 hover:bg-blue-50 hover:text-blue-700 transition-colors">Antigripales</a></li>
                                <li><a href="categoria.html?nombre=Gastrointestinales" class="block px-5 py-2 hover:bg-blue-50 hover:text-blue-700 transition-colors">Gastrointestinales</a></li>
                            </ul>
                        </li>

                        <!-- Categoría Principal 2 -->
                        <li class="relative group/sub">
                            <span class="px-5 py-3 hover:bg-blue-50 flex justify-between items-center cursor-default hover:text-blue-700 transition-colors">
                                🧴 Dermocosmética
                                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </span>
                            
                            <!-- SEGUNDO NIVEL: Submenú de Dermocosmética -->
                            <ul class="absolute left-full top-0 ml-0 w-56 bg-white border border-gray-100 shadow-xl rounded-lg opacity-0 invisible group-hover/sub:opacity-100 group-hover/sub:visible transition-all duration-200 z-50 py-2">
                                <li><a href="categoria.html?nombre=Limpieza Facial" class="block px-5 py-2 hover:bg-blue-50 hover:text-blue-700 transition-colors">Limpieza Facial</a></li>
                                <li><a href="categoria.html?nombre=Cremas Antiage" class="block px-5 py-2 hover:bg-blue-50 hover:text-blue-700 transition-colors">Cremas Antiage</a></li>
                                <li><a href="categoria.html?nombre=Protectores Solares" class="block px-5 py-2 hover:bg-blue-50 hover:text-blue-700 transition-colors">Protectores Solares</a></li>
                            </ul>
                        </li>

                        <!-- Categoría Principal 3 (Sin subcategorías) -->
                        <li>
                            <a href="categoria.html?nombre=Nutrición" class="block px-5 py-3 hover:bg-blue-50 hover:text-blue-700 transition-colors">
                                💪 Nutrición Deportiva
                            </a>
                        </li>
                    </ul>
                </li>

                <!-- 2. ENLACES DIRECTOS (Opcional, para complementar el desplegable) -->
                <li><a href="index.html" class="whitespace-nowrap hover:text-green-400 transition border-b-2 border-transparent hover:border-green-400 pb-1">🔥 Ofertas del Mes</a></li>
                <li><a href="categoria.html?nombre=Venta Libre" class="whitespace-nowrap hover:text-green-400 transition border-b-2 border-transparent hover:border-green-400 pb-1">Medicamentos</a></li>
                <li><a href="categoria.html?nombre=Dermocosmética" class="whitespace-nowrap hover:text-green-400 transition border-b-2 border-transparent hover:border-green-400 pb-1">Belleza</a></li>
            </ul>
        </div>
    </nav>
    </header>

    <!-- MAIN: Contenedor donde se inyectará el producto -->
    <main class="container mx-auto p-4 mt-6 max-w-5xl mb-20" id="productContainer">
        <!-- El JS rellenará esto dinámicamente -->
    </main>

    <!-- 1. Importamos la base de datos simulada -->
    <script src="js/productos.js"></script>
    
    <!-- 2. Importamos el motor del carrito -->
    <script src="js/carrito.js"></script>

    <script src="js/buscador.js"></script> <!-- Nuevo script -->

    <!-- 3. Lógica para renderizar el producto y manejar cantidad -->
    <script>
        // Obtener el ID de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const productoId = parseInt(urlParams.get('id'));

        // Buscar el producto
        const producto = productosFarmacia.find(p => p.id === productoId);
        const container = document.getElementById('productContainer');

        if (!producto) {
            container.innerHTML = `
                <div class="text-center py-20 bg-white rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-2xl font-bold text-gray-800 mb-4">Producto no encontrado</h2>
                    <p class="text-gray-500 mb-6">El medicamento que buscás no existe o fue retirado.</p>
                    <a href="index.html" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 transition">Volver al catálogo</a>
                </div>
            `;
        } else {
            // Textos por defecto por si no agregaste estas propiedades en productos.js aún
            const desc = producto.descripcion || "Información detallada sobre este producto no disponible por el momento.";
            const modoUso = producto.modoUso || "Consulte a su médico o farmacéutico antes de utilizar este producto.";
            const ficha = producto.fichaTecnica || `Marca: ${producto.marca} <br> Formato: ${producto.formato}`;

            const htmlDescuento = producto.descuento 
                ? `<span class="bg-green-500 text-white text-sm font-bold px-3 py-1 rounded ml-3 shadow-sm">${producto.descuento} OFF</span>` 
                : '';
            
            const htmlPrecioViejo = producto.precioViejo 
                ? `<p class="text-gray-400 text-lg line-through mb-1">$${producto.precioViejo}</p>` 
                : '';

            // Inyectar la estructura
            container.innerHTML = `
                <!-- Bloque Superior: Foto y Compra -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 flex flex-col md:flex-row gap-10 mb-8">
                    
                    <!-- Lado Izquierdo: Imagen -->
                    <div class="md:w-1/2 flex items-center justify-center bg-white rounded-xl p-4">
                        <img src="${producto.imagen}" alt="${producto.nombre}" class="max-w-full h-auto object-contain drop-shadow-sm hover:scale-105 transition-transform duration-300">
                    </div>

                    <!-- Lado Derecho: Título, Precios y Botón -->
                    <div class="md:w-1/2 flex flex-col justify-center">
                        <span class="text-sm text-blue-600 font-bold uppercase tracking-wider mb-2">${producto.marca}</span>
                        <h1 class="text-3xl font-extrabold text-gray-800 leading-tight mb-3">${producto.nombre}</h1>
                        <p class="text-gray-500 font-medium mb-6 bg-gray-50 inline-block px-3 py-1 rounded-md w-max">${producto.formato}</p>
                        
                        <div class="mb-8 border-t border-b border-gray-100 py-6">
                            ${htmlPrecioViejo}
                            <div class="flex items-center">
                                <p class="text-blue-800 font-extrabold text-4xl">$${producto.precio}</p>
                                ${htmlDescuento}
                            </div>
                        </div>

                        <!-- Selector de Cantidad y Botón Agregar -->
                        <div class="flex flex-col sm:flex-row gap-4">
                            <!-- Input de cantidad -->
                            <div class="flex items-center border-2 border-gray-200 rounded-xl overflow-hidden bg-white w-full sm:w-1/3">
                                <button onclick="modificarCantidad(-1)" class="px-4 py-3 text-gray-600 font-bold hover:bg-gray-100 transition">-</button>
                                <input type="number" id="inputCantidad" value="1" min="1" class="w-full text-center font-bold text-lg text-gray-800 focus:outline-none appearance-none" readonly>
                                <button onclick="modificarCantidad(1)" class="px-4 py-3 text-gray-600 font-bold hover:bg-gray-100 transition">+</button>
                            </div>
                            
                            <!-- Botón de comprar -->
                            <button onclick="agregarConCantidad('${producto.nombre}', ${producto.precio})" class="w-full sm:w-2/3 bg-blue-700 text-white font-bold py-3 px-6 rounded-xl hover:bg-blue-800 transition-colors duration-200 text-lg flex items-center justify-center gap-3 shadow-lg hover:shadow-xl">
                                🛒 Agregar al Carrito
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Bloque Inferior: Menús Desplegables (Acordeón) -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 divide-y divide-gray-100">
                    
                    <!-- Acordeón 1: Descripción -->
                    <details class="group p-6" open>
                        <summary class="flex justify-between items-center font-bold cursor-pointer list-none text-lg text-gray-800">
                            <span>Descripción del producto</span>
                            <span class="transition group-open:rotate-180">
                                <svg fill="none" height="24" shape-rendering="geometricPrecision" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" width="24"><path d="M6 9l6 6 6-6"></path></svg>
                            </span>
                        </summary>
                        <div class="text-gray-600 mt-4 leading-relaxed">
                            <p>${desc}</p>
                        </div>
                    </details>

                    <!-- Acordeón 2: Modo de Uso -->
                    <details class="group p-6">
                        <summary class="flex justify-between items-center font-bold cursor-pointer list-none text-lg text-gray-800">
                            <span>Modo de uso</span>
                            <span class="transition group-open:rotate-180">
                                <svg fill="none" height="24" shape-rendering="geometricPrecision" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" width="24"><path d="M6 9l6 6 6-6"></path></svg>
                            </span>
                        </summary>
                        <div class="text-gray-600 mt-4 leading-relaxed">
                            <p>${modoUso}</p>
                        </div>
                    </details>

                    <!-- Acordeón 3: Ficha Técnica -->
                    <details class="group p-6">
                        <summary class="flex justify-between items-center font-bold cursor-pointer list-none text-lg text-gray-800">
                            <span>Ficha técnica</span>
                            <span class="transition group-open:rotate-180">
                                <svg fill="none" height="24" shape-rendering="geometricPrecision" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" width="24"><path d="M6 9l6 6 6-6"></path></svg>
                            </span>
                        </summary>
                        <div class="text-gray-600 mt-4 leading-relaxed">
                            <p>${ficha}</p>
                        </div>
                    </details>
                </div>
            `;
        }

        // --- Funciones auxiliares para la cantidad en esta vista ---

        // Función para los botones de + y -
        function modificarCantidad(cambio) {
            const input = document.getElementById('inputCantidad');
            let nuevaCantidad = parseInt(input.value) + cambio;
            if (nuevaCantidad >= 1) {
                input.value = nuevaCantidad;
            }
        }

       // Función puente mejorada: Manda el nombre, el precio y la cantidad directamente a carrito.js
       function agregarConCantidad(nombre, precio) {
            const cantidad = parseInt(document.getElementById('inputCantidad').value) || 1;
            
            // Llamamos a la nueva función de carrito.js pasándole la cantidad
            addToCart(nombre, precio, cantidad);
            
            // Reseteamos el contador a 1
            document.getElementById('inputCantidad').value = 1;
        }
    </script>
</body>
</html>
